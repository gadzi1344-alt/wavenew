<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wave · Лента</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wave">
<meta name="theme-color" content="#0a0a0a">
<style>
  :root{--bg:#0a0a0a;--side:#0e0e0e;--surface:#151515;--surface2:#1d1d1d;--line:#202020;--txt:#ededed;--muted:#8c8c8c;--dim:#5a5a5a;--ease:cubic-bezier(.2,.7,.2,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
  button{cursor:pointer}
  textarea{resize:none}
  .app{display:grid;grid-template-columns:240px 1fr;height:100%}

  /* ---------- Боковая панель (компьютер) ---------- */
  aside{background:var(--side);border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;gap:4px}
  .brand{font-weight:800;font-size:20px;letter-spacing:-.4px;padding:4px 12px 26px}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:999px;color:#c4c4c4;font-size:14px;font-weight:500;text-align:left;transition:background .25s,color .25s}
  .nav button:hover{background:var(--surface);color:#fff}
  .nav button.active{background:#ffffff1c;color:#fff}
  .nav svg,.tabbar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .newbtn{margin-top:18px;padding:12px;border-radius:999px;background:var(--txt);color:#000;font-weight:700;font-size:14px;transition:transform .25s var(--ease)}
  .newbtn:hover{transform:translateY(-1px)}

  /* ---------- Основная колонка ---------- */
  main{overflow-y:auto;padding:28px 0 60px;min-width:0;animation:enter .45s var(--ease) both}
  @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .col{width:min(620px,calc(100% - 48px));margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;transition:background .25s,border-color .25s}
  .card[data-open]{cursor:pointer}
  .card[data-open]:hover{background:var(--surface2);border-color:#2a2a2a}
  .pills{display:flex;gap:8px;margin-bottom:16px}
  .pills button{padding:8px 18px;border-radius:999px;background:var(--surface);color:var(--muted);font-size:14px;font-weight:600;transition:background .25s,color .25s}
  .pills button.on{background:var(--txt);color:#000}
  .pill{padding:10px 20px;border-radius:999px;border:1px solid #2e2e2e;font-size:14px;font-weight:600;transition:background .25s}
  .pill:hover{background:var(--surface)}
  .pill.on{background:var(--txt);color:#000;border-color:var(--txt)}
  .pill.danger{color:#d97070;border-color:#3a2222}
  .sub{color:var(--muted);font-size:13px}
  .center{text-align:center;padding:30px 0}
  h2{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
  .section{font-size:16px;font-weight:700;margin:22px 0 12px}
  .more{display:flex;justify-content:center;margin:10px 0 6px}

  /* ---------- Аватары, галочка, значки ---------- */
  .av{width:44px;height:44px;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;flex:none;overflow:hidden}
  .av.sm{width:38px;height:38px;font-size:15px}
  .av.xl{width:120px;height:120px;font-size:44px;box-shadow:0 20px 50px #000a}
  .who{min-width:0;flex:1}
  .nm{font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
  .nm:hover{text-decoration:underline;text-underline-offset:3px}
  .vf{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#fff;color:#000;font-size:10px;font-weight:800;margin-left:4px}
  .bd{font-size:14px;margin-left:2px}
  .tm{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  .ph-head{display:flex;align-items:center;gap:12px}
  .x{width:30px;height:30px;border-radius:50%;color:var(--dim);font-size:20px;transition:background .2s,color .2s}
  .x:hover{background:var(--surface2);color:#d97070}

  /* ---------- Пост ---------- */
  .txt{font-size:15px;line-height:1.5;margin:12px 0;white-space:pre-wrap;word-break:break-word}
  .pimg{display:block;width:100%;max-height:520px;object-fit:cover;border-radius:16px;margin-top:10px;background:var(--surface2)}
  .acts2{display:flex;gap:6px;margin-top:12px;color:var(--muted);font-size:13px}
  .acts2 button,.acts2 span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;transition:background .25s,color .25s}
  .acts2 button:hover{background:var(--surface2);color:#fff}
  .acts2 button.on{color:#f25f7a}
  .acts2 button.on svg{fill:currentColor}
  .acts2 svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- Композер ---------- */
  .comp textarea{width:100%;min-height:88px;font-size:15px;line-height:1.5;padding:4px 2px}
  .comp textarea::placeholder{color:var(--dim)}
  .comp-row{display:flex;align-items:center;gap:10px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .attach{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:13px;cursor:pointer;transition:color .25s}
  .attach:hover{color:#fff}
  .attach input{display:none}
  .thumb{position:relative;margin-top:12px;display:inline-block}
  .thumb img{width:120px;height:120px;object-fit:cover;border-radius:14px}
  .thumb button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#000;border:1px solid #333;font-size:14px}
  .grow{flex:1}

  /* ---------- Профиль ---------- */
  .prof{display:flex;gap:22px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .prof .ti{min-width:0;flex:1}
  .prof h2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .stats{display:flex;gap:22px;margin:14px 0;font-size:14px}
  .stats b{font-size:17px;margin-right:4px}
  .bio{color:#bdbdbd;font-size:14px;line-height:1.5;white-space:pre-wrap}
  .prof .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .avatar-pick{position:relative;cursor:pointer}
  .avatar-pick input{display:none}
  .avatar-pick:hover .av{filter:brightness(.8)}

  /* ---------- Поиск и админка ---------- */
  .field{width:100%;padding:14px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px;transition:border-color .25s}
  .field:focus{border-color:#3a3a3a}
  .field::placeholder{color:var(--dim)}
  .urow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
  .urow .who{min-width:140px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:6px 10px;border-radius:999px;border:1px solid #2e2e2e;font-size:14px;transition:background .2s,border-color .2s}
  .chip.on{background:#ffffff1c;border-color:#fff}
  .switch{padding:7px 14px;border-radius:999px;border:1px solid #2e2e2e;font-size:13px;font-weight:600;transition:background .2s}
  .switch.on{background:#fff;color:#000;border-color:#fff}

  /* ---------- Вход и регистрация ---------- */
  .auth{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
  .auth .field{padding:13px 16px}

  /* ---------- Нижняя панель (телефон) ---------- */
  .tabbar{display:none}
  .toast{position:fixed;top:18px;right:18px;z-index:40;max-width:340px;background:var(--surface2);border:1px solid #2a2a2a;padding:12px 16px;border-radius:12px;font-size:13px;display:none}

  @media (max-width:760px){
    .app{grid-template-columns:1fr}
    aside{display:none}
    main{padding:18px 0 150px}
    .col{width:calc(100% - 28px)}
    .card{padding:14px;border-radius:18px}
    .tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);height:66px;padding:6px;justify-content:space-around;align-items:center;background:#111111f2;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #2a2a2a;border-radius:24px;box-shadow:0 18px 40px #000b;z-index:22}
    .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#7d7d7d;font-size:10px;font-weight:600;transition:color .3s}
    .tabbar .ic{width:50px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .35s var(--ease)}
    .tabbar button.active{color:#fff}
    .tabbar button.active .ic{background:#ffffff1f}
    .tabbar .mid .ic{width:46px;height:46px;background:var(--txt);color:#000}
    .tabbar .mid svg{stroke:#000}
    .toast{top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;max-width:none}
    .prof{flex-direction:column;text-align:center}
    .prof h2{justify-content:center}
    .prof .acts{justify-content:center}
  }
  /* ---------- Боковая панель: только иконки (компьютер) ---------- */
  @media (min-width:761px){
    .app{grid-template-columns:84px 1fr}
    aside{padding:24px 0;align-items:center;gap:10px;overflow:visible}
    .brand{padding:0 0 18px;font-size:22px;text-align:center;width:100%}
    .nav{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
    .nav button{width:52px;height:52px;padding:0;justify-content:center;gap:0;border-radius:18px}
    .nav button.active{background:#ffffff1c;box-shadow:inset 0 0 0 1px #ffffff14}
    .nav svg{width:22px;height:22px}
    .newbtn{width:52px;height:52px;padding:0;margin-top:14px;border-radius:18px;display:grid;place-items:center}
    .newbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  }

  /* ---------- Анимации ---------- */
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes likePop{0%{transform:scale(.6)}55%{transform:scale(1.35)}100%{transform:scale(1)}}
  #feed .card,.comp{animation:cardIn .55s var(--ease) both}
  #feed .card:nth-child(2){animation-delay:55ms}
  #feed .card:nth-child(3){animation-delay:110ms}
  #feed .card:nth-child(4){animation-delay:165ms}
  #feed .card:nth-child(5){animation-delay:220ms}
  #feed .card:nth-child(6){animation-delay:275ms}
  .card{transition:transform .35s var(--ease),background .25s,border-color .25s,box-shadow .35s}
  .card[data-open]:hover{transform:translateY(-2px);box-shadow:0 18px 40px #0008}
  .card:hover .av{transform:scale(1.05)}
  .av{transition:transform .35s var(--ease)}
  .pimg{transition:transform .6s var(--ease)}
  .card:hover .pimg{transform:scale(1.015)}
  .acts2 button.on svg{animation:likePop .45s var(--ease)}
  .pills button{transition:background .3s var(--ease),color .3s}
  .pill,.newbtn,.nav button,.pills button{transition:background .25s,color .25s,transform .2s var(--ease)}
  .pill:active,.newbtn:active,.nav button:active,.pills button:active,.x:active{transform:scale(.94)}
  .tabbar button:active .ic{transform:scale(.92)}
  .tabbar .ic{transition:background .35s var(--ease),transform .25s var(--ease)}
  /* ---------- Экран входа и регистрации (до входа) ---------- */
  body.gate aside,body.gate .tabbar{display:none !important}
  body.gate .app{grid-template-columns:1fr}
  .gate-wrap{min-height:100%;display:grid;place-items:center;padding:24px}
  .gate-card{width:min(400px,100%);padding:28px;display:flex;flex-direction:column;gap:12px;animation:cardIn .6s var(--ease) both}
  .gate-card h2{text-align:center}
  .gate-card .sub{text-align:center}
  .gate-logo{width:56px;height:56px;border-radius:18px;background:var(--txt);color:#000;display:grid;place-items:center;font-weight:900;font-size:24px;margin:0 auto 6px}
  .gate-card .pill{width:100%;padding:13px}
  /* ---------- Боковая панель: закруглённая палка со значками (компьютер) ---------- */
  @media (min-width:761px){
    .nav{width:76px;padding:14px 0;gap:12px;background:var(--side);border:1px solid var(--line);border-radius:44px;box-shadow:0 20px 50px #0007}
    .nav .newbtn{margin-top:6px;background:var(--txt);color:#000}
    .newbtn{width:52px;height:52px}
  }
  /* ---------- Боковая панель: капсула по центру экрана по вертикали, логотип сверху ---------- */
  @media (min-width:761px){
    aside{position:relative;justify-content:center;padding:0}
    .brand{position:absolute;top:24px;left:0;right:0;padding:0;text-align:center}
  }
</style>
</head>
<body>

<div class="app">
  <aside>
    <div class="brand">W</div>
    <nav class="nav" id="nav">
      <button data-go="feed" title="Лента"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></button>
      <button data-go="search" title="Поиск"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <button data-go="profile" title="Профиль"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
      <button class="newbtn" id="newBtn" title="Новый пост"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </nav>
  </aside>

  <main id="main"></main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-go="feed"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></span><span>Лента</span></button>
  <button data-go="search"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span><span>Поиск</span></button>
  <button class="mid" id="tabNew"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span>Пост</span></button>
  <button data-go="profile"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span><span>Профиль</span></button>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ---------- Подключение к Supabase ----------
const SUPABASE_URL = 'https://ruwgepjzfxkdruqdxvfp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zLy_AdJpkGd_dVC8b64frQ_97DaIYA9';
function showFatal(msg) {
  const b = document.createElement('div');
  b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#2a1212;color:#ffb3b3;padding:14px 16px;border-radius:12px;font:14px system-ui,sans-serif;white-space:pre-wrap;box-shadow:0 12px 30px #000a';
  b.textContent = msg;
  document.body.appendChild(b);
}
window.addEventListener('error', (e) => showFatal('Ошибка скрипта: ' + e.message));
window.addEventListener('unhandledrejection', (e) => showFatal('Ошибка: ' + (e.reason?.message || e.reason)));
const sb = (typeof supabase !== 'undefined')
  ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;
if (!sb) showFatal('Не загрузилась библиотека Supabase. Проверьте интернет и обновите страницу (Ctrl+F5).');

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BADGE = { star: '⭐', fire: '🔥', heart: '💜', cat: '🐱', crown: '👑', flower: '🌸', sparkle: '✨', bunny: '🐰' };
const BADGE_LABEL = { star: 'Звезда', fire: 'Огонь', heart: 'Сердечко', cat: 'Котик', crown: 'Корона', flower: 'Цветочек', sparkle: 'Блёстки', bunny: 'Зайка' };
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.6-9.2C.9 8.2 2.8 4.5 6.6 4.5c2.3 0 3.8 1.3 5.4 3.1 1.6-1.8 3.1-3.1 5.4-3.1 3.8 0 5.7 3.7 4.2 6.8-2.1 4.6-9.6 9.2-9.6 9.2z"/></svg>';
const COMMENT = '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
const EYE = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const POST_COLS = 'id,text,image_url,views,created_at,user_id,profiles(name,verified,badges,avatar_url),likes(count),comments(count)';

let me = null;
let route = { name: 'feed', tab: 'all' };
let feedBefore = null;
let pendingImg = '';
let gateMode = 'reg';
let adminList = [];

// ---------- Вспомогательное ----------
const hue = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 0);
const av = (u, cls = 'av') => u.avatar
  ? `<div class="${cls}" style="background-image:url('${esc(u.avatar)}')"></div>`
  : `<div class="${cls}" style="background:linear-gradient(135deg,hsl(${hue(u.name)} 60% 50%),hsl(${hue(u.name) + 50} 60% 30%))">${esc(u.name[0].toUpperCase())}</div>`;
const verify = (u) => u.verified ? '<span class="vf" title="Подтверждённый аккаунт">✓</span>' : '';
const badges = (u) => (u.badges || []).map((b) => `<span class="bd" title="${esc(BADGE_LABEL[b] || '')}">${BADGE[b] || ''}</span>`).join('');
const ago = (ts) => {
  const d = Math.max(0, Date.now() / 1000 - ts);
  if (d < 60) return 'только что';
  if (d < 3600) return Math.floor(d / 60) + ' мин назад';
  if (d < 86400) return Math.floor(d / 3600) + ' ч назад';
  return new Date(ts * 1000).toLocaleDateString('ru-RU');
};
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (t.style.display = 'none'), 3200);
}
const mapUser = (p) => p ? { id: p.id, name: p.name, bio: p.bio || '', verified: !!p.verified, badges: p.badges || [], avatar: p.avatar_url || '' } : { name: '?', verified: false, badges: [], avatar: '' };
const mapPost = (r, likedSet) => ({
  id: r.id, text: r.text || '', image: r.image_url || '', views: r.views || 0,
  created: new Date(r.created_at).getTime() / 1000,
  likes: r.likes?.[0]?.count ?? 0, comments: r.comments?.[0]?.count ?? 0,
  liked: likedSet.has(r.id),
  can: !!me && (me.admin || r.user_id === me.id),
  author: mapUser(r.profiles),
});

// Загружает посты с авторами, счётчиками и отметкой «мой лайк»
async function postsWith(query) {
  const { data, error } = await query;
  if (error) throw new Error(error.message);
  let liked = new Set();
  if (me && data.length) {
    const { data: lk } = await sb.from('likes').select('post_id').eq('user_id', me.id).in('post_id', data.map((p) => p.id));
    liked = new Set((lk || []).map((l) => l.post_id));
  }
  return data.map((r) => mapPost(r, liked));
}

async function loadMe() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { me = null; return; }
  const { data: p } = await sb.from('profiles').select('*').eq('id', data.session.user.id).single();
  me = p ? { ...mapUser(p), admin: p.name === 'bibnaq' } : null;
}

// ---------- Маршруты ----------
function go(r) { route = r; render(); }
function setActive() {
  const key = route.name === 'profile' || route.name === 'admin' ? 'profile' : route.name === 'post' ? 'feed' : route.name;
  $$('#nav button, #tabbar button').forEach((b) => b.classList.toggle('active', b.dataset.go === key));
}
async function render() {
  document.body.classList.toggle('gate', !me);
  if (!me) return renderGate('reg');
  setActive();
  try {
    if (route.name === 'feed') await renderFeed();
    else if (route.name === 'post') await renderPost(route.id);
    else if (route.name === 'profile') await renderProfile(route.user);
    else if (route.name === 'search') renderSearch();
    else if (route.name === 'admin') await renderAdmin();
  } catch (e) {
    $('#main').innerHTML = `<div class="col"><p class="sub center">Ошибка: ${esc(e.message)}</p></div>`;
  }
  watchViews($('#main'));
}

// ---------- Вход и регистрация ----------
function renderGate(mode) {
  gateMode = mode || gateMode;
  const reg = gateMode === 'reg';
  document.body.classList.add('gate');
  $('#main').innerHTML = `<div class="gate-wrap"><div class="card gate-card">
    <div class="gate-logo">W</div>
    <h2>${reg ? 'Регистрация' : 'Вход'}</h2>
    <p class="sub">${reg ? 'Создайте аккаунт, чтобы смотреть ленту и писать посты' : 'Войдите в свой аккаунт'}</p>
    <input class="field" id="aname" placeholder="Имя (латиница, цифры, _ . -)" autocomplete="username">
    <input class="field" id="apass" type="password" placeholder="Пароль (минимум 6 символов)" autocomplete="${reg ? 'new-password' : 'current-password'}">
    <input class="field" id="acode" placeholder="Код администратора (только для админа)" style="display:${reg ? 'block' : 'none'}">
    <div class="sub" id="gateErr" style="color:#d97070;min-height:16px"></div>
    <button class="pill on" id="authGo">${reg ? 'Зарегистрироваться' : 'Войти'}</button>
    <button class="pill" id="authSwitch">${reg ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Регистрация'}</button>
  </div></div>`;
}
async function authSubmit() {
  const name = $('#aname').value.trim().toLowerCase();
  const password = $('#apass').value;
  const code = $('#acode')?.value || '';
  if (!/^[a-z0-9_.\-]{3,20}$/.test(name)) throw new Error('Имя: 3–20 символов, латиница, цифры, _ . -');
  if (password.length < 6) throw new Error('Пароль: минимум 6 символов');
  if (!sb) throw new Error('Нет связи с Supabase. Обновите страницу.');
  const email = `${name}@wave.app`;
  if (gateMode === 'reg') {
    const { error } = await sb.auth.signUp({ email, password, options: { data: { name, code } } });
    if (error) throw new Error(/already/i.test(error.message) ? 'Такое имя уже занято' : error.message);
    const { error: e2 } = await sb.auth.signInWithPassword({ email, password });
    if (e2) throw new Error(e2.message);
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw new Error('Неверное имя или пароль');
  }
  await loadMe();
  if (!me) {
    // Запасной путь: профиль не создался триггером, создаём его функцией в базе
    const { error: e3 } = await sb.rpc('ensure_profile', { uname: name, code });
    if (e3) throw new Error(e3.message);
    await loadMe();
  }
  if (!me) throw new Error('Вход выполнен, но профиль не найден. Выполните supabase.sql ещё раз.');
  toast('Добро пожаловать, ' + me.name);
  go({ name: 'feed', tab: 'all' });
}

// ---------- Композер и лента ----------
function composer() {
  return `<div class="card comp" id="comp">
    <textarea id="ptext" maxlength="1000" placeholder="Что нового?"></textarea>
    <div id="pthumb"></div>
    <div class="comp-row">
      <label class="attach">📷 Фото<input type="file" id="pfile" accept="image/*"></label>
      <span class="grow"></span>
      <button class="pill on" id="publish">Опубликовать</button>
    </div>
    <div class="sub" id="pstatus" style="margin-top:8px;color:#d97070;min-height:16px"></div>
  </div>`;
}
function postCard(p) {
  return `<article class="card" data-open="${p.id}">
    <div class="ph-head">
      ${av(p.author, 'av sm')}
      <div class="who"><span class="nm" data-user="${esc(p.author.name)}">${esc(p.author.name)}${verify(p.author)}${badges(p.author)}</span><span class="tm">${ago(p.created)}</span></div>
      ${p.can ? `<button class="x" data-del="${p.id}" title="Удалить">×</button>` : ''}
    </div>
    ${p.text ? `<p class="txt">${esc(p.text)}</p>` : ''}
    ${p.image ? `<img class="pimg" src="${esc(p.image)}" loading="lazy" alt="">` : ''}
    <div class="acts2">
      <button data-like="${p.id}" class="${p.liked ? 'on' : ''}">${HEART}<b>${p.likes}</b></button>
      <span>${COMMENT}${p.comments}</span>
      <span>${EYE}${p.views}</span>
    </div>
  </article>`;
}

const FEED_LIMIT = 20;
async function renderFeed() {
  const tab = route.tab || 'all';
  $('#main').innerHTML = `<div class="col">
    <h2>Лента</h2>
    <div class="pills" style="margin-top:14px"><button data-tab="all" class="${tab === 'all' ? 'on' : ''}">Для вас</button><button data-tab="follow" class="${tab === 'follow' ? 'on' : ''}">Подписки</button></div>
    ${tab === 'all' ? composer() : ''}
    <div id="feed"><p class="sub center">Загрузка…</p></div>
    <div class="more" id="moreBox"></div>
  </div>`;
  $('#publish').onclick = publishPost;
  $('#pfile').onchange = onPostFile;
  feedBefore = null;
  await loadFeed();
}
async function loadFeed() {
  const first = !feedBefore;
  const show = (html) => { const el = $('#feed'); if (el) el.innerHTML = html; };
  try {
    let q = sb.from('posts').select(POST_COLS).order('id', { ascending: false }).limit(FEED_LIMIT);
    if (feedBefore) q = q.lt('id', feedBefore);
    if (route.tab === 'follow') {
      if (!me) throw new Error('Войдите, чтобы видеть подписки');
      const { data: f } = await sb.from('follows').select('followee_id').eq('follower_id', me.id);
      const ids = (f || []).map((x) => x.followee_id);
      if (!ids.length) { if (first) show('<p class="sub center">Подпишитесь на людей, чтобы видеть их посты</p>'); return; }
      q = q.in('user_id', ids);
    }
    const posts = await postsWith(q);
    const feedEl = $('#feed');
    if (!feedEl) return;
    if (first) feedEl.innerHTML = '';
    if (first && !posts.length) feedEl.innerHTML = '<p class="sub center">Пока пусто. Напишите первый пост!</p>';
    else feedEl.insertAdjacentHTML('beforeend', posts.map(postCard).join(''));
    watchViews(feedEl);
    feedBefore = posts.length ? posts[posts.length - 1].id : feedBefore;
    const more = $('#moreBox');
    if (more) more.innerHTML = posts.length >= FEED_LIMIT ? '<button class="pill" data-more>Показать ещё</button>' : '';
  } catch (e) {
    show(`<p class="sub center">Ошибка ленты: ${esc(e.message)}</p>`);
  }
}

async function publishPost() {
  const btn = $('#publish');
  const status = $('#pstatus');
  const text = ($('#ptext')?.value || '').trim();
  status.textContent = '';
  if (!text && !pendingImg) { status.textContent = 'Напишите текст или добавьте фото'; return; }
  btn.disabled = true;
  btn.textContent = 'Публикуем…';
  try {
    const { error } = await sb.from('posts').insert({ user_id: me.id, text, image_url: pendingImg });
    if (error) throw new Error(error.message);
    pendingImg = '';
    await renderFeed();
    toast('Пост опубликован');
  } catch (e) {
    status.textContent = 'Не опубликовалось: ' + e.message;
    btn.disabled = false;
    btn.textContent = 'Опубликовать';
  }
}

// ---------- Фото ----------
async function uploadImage(file) {
  const ext = ((file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'jpg';
  const path = `${me.id}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from('media').upload(path, file, { contentType: file.type });
  if (error) throw new Error(error.message);
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
async function onPostFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  try {
    pendingImg = await uploadImage(f);
    $('#pthumb').innerHTML = `<div class="thumb"><img src="${esc(pendingImg)}" alt=""><button data-rmimg>×</button></div>`;
  } catch (err) { toast(err.message); }
}

// ---------- Просмотры: засчитываются, когда пост появился на экране ----------
const seenIds = new Set();
let viewQueue = [];
let viewTimer = null;
function flushViews() {
  if (!viewQueue.length || !me) return;
  const ids = viewQueue;
  viewQueue = [];
  sb.rpc('mark_views', { ids }).then(() => {}, () => {});
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver((entries) => {
  for (const en of entries) {
    if (!en.isIntersecting) continue;
    const id = Number(en.target.dataset.open);
    if (!id || seenIds.has(id)) continue;
    seenIds.add(id);
    viewQueue.push(id);
    io.unobserve(en.target);
  }
  clearTimeout(viewTimer);
  viewTimer = setTimeout(flushViews, 1500);
}, { threshold: 0.6 }) : null;
function watchViews(root) {
  if (!io || !root) return;
  root.querySelectorAll('[data-open]').forEach((el) => io.observe(el));
}

// ---------- Пост с комментариями ----------
async function renderPost(id) {
  const [post] = await postsWith(sb.from('posts').select(POST_COLS).eq('id', id));
  if (!post) throw new Error('Пост не найден');
  const { data: cm } = await sb.from('comments').select('id,text,created_at,profiles(name,verified,badges,avatar_url)').eq('post_id', id).order('id');
  const comments = (cm || []).map((c) => ({ id: c.id, text: c.text, created: new Date(c.created_at).getTime() / 1000, author: mapUser(c.profiles) }));
  $('#main').innerHTML = `<div class="col">
    <button class="pill" data-go="feed" style="margin-bottom:14px">← Назад</button>
    ${postCard(post).replace(`data-open="${post.id}"`, '')}
    <h2 class="section">Комментарии · ${comments.length}</h2>
    ${comments.map((c) => `<div class="card" style="padding:12px 14px">
      <div class="ph-head">${av(c.author, 'av sm')}<div class="who"><span class="nm" data-user="${esc(c.author.name)}">${esc(c.author.name)}${verify(c.author)}${badges(c.author)}</span><span class="tm">${ago(c.created)}</span></div></div>
      <p class="txt" style="margin:8px 0 0">${esc(c.text)}</p></div>`).join('') || '<p class="sub">Комментариев пока нет</p>'}
    <div class="card comp" style="margin-top:14px">
      <textarea id="ctext" maxlength="500" placeholder="Ваш комментарий"></textarea>
      <div class="comp-row"><span class="grow"></span><button class="pill on" data-comment="${post.id}">Отправить</button></div>
    </div>
  </div>`;
}

// ---------- Профиль ----------
async function renderProfile(name) {
  const target = (name || me.name).toLowerCase();
  const { data: p, error } = await sb.from('profiles').select('*').eq('name', target).single();
  if (error || !p) throw new Error('Пользователь не найден');
  const u = mapUser(p);
  const isMe = !!me && me.id === u.id;
  const count = async (q) => (await q).count || 0;
  const followers = await count(sb.from('follows').select('*', { count: 'exact', head: true }).eq('followee_id', u.id));
  const following = await count(sb.from('follows').select('*', { count: 'exact', head: true }).eq('follower_id', u.id));
  const postsN = await count(sb.from('posts').select('*', { count: 'exact', head: true }).eq('user_id', u.id));
  let isFollowing = false;
  if (me && !isMe) {
    const { data: f } = await sb.from('follows').select('follower_id').eq('follower_id', me.id).eq('followee_id', u.id);
    isFollowing = !!(f && f.length);
  }
  const posts = await postsWith(sb.from('posts').select(POST_COLS).eq('user_id', u.id).order('id', { ascending: false }).limit(FEED_LIMIT));
  const canAdmin = isMe && me.admin;
  $('#main').innerHTML = `<div class="col">
    <div class="card" style="padding:22px">
      <div class="prof">
        ${isMe ? `<label class="avatar-pick" title="Сменить фото">${av(u, 'av xl')}<input type="file" id="afile" accept="image/*"></label>` : av(u, 'av xl')}
        <div class="ti">
          <h2>${esc(u.name)}${verify(u)} ${badges(u)}</h2>
          <div class="stats"><span><b>${postsN}</b>постов</span><span><b>${followers}</b>подписчиков</span><span><b>${following}</b>подписок</span></div>
          <p class="bio">${esc(u.bio) || (isMe ? '<span class="sub">Расскажите о себе</span>' : '')}</p>
          <div class="acts">
            ${isMe ? `<button class="pill" id="editBio">Изменить описание</button>
              <button class="pill" id="logout">Выйти</button>
              ${canAdmin ? '<button class="pill on" data-go="admin">Админ-панель</button>' : ''}`
              : me ? `<button class="pill ${isFollowing ? '' : 'on'}" data-follow="${esc(u.name)}">${isFollowing ? 'Отписаться' : 'Подписаться'}</button>` : ''}
          </div>
        </div>
      </div>
    </div>
    <div id="feed">${posts.map(postCard).join('') || '<p class="sub center">Постов пока нет</p>'}</div>
  </div>`;
  if (isMe) $('#afile').onchange = onAvatarFile;
}
async function onAvatarFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const url = await uploadImage(f);
    const { error } = await sb.from('profiles').update({ avatar_url: url }).eq('id', me.id);
    if (error) throw new Error(error.message);
    toast('Аватарка обновлена');
    renderProfile();
  } catch (err) { toast(err.message); }
}
async function toggleFollow(name) {
  if (!me) return toast('Войдите, чтобы подписываться');
  const { data: t } = await sb.from('profiles').select('id').eq('name', name.toLowerCase()).single();
  const { data: ex } = await sb.from('follows').select('follower_id').eq('follower_id', me.id).eq('followee_id', t.id);
  if (ex && ex.length) await sb.from('follows').delete().eq('follower_id', me.id).eq('followee_id', t.id);
  else await sb.from('follows').insert({ follower_id: me.id, followee_id: t.id });
  renderProfile(name);
}

// ---------- Поиск ----------
function renderSearch() {
  $('#main').innerHTML = `<div class="col">
    <h2>Поиск</h2>
    <input class="field" id="sq" placeholder="Люди и посты" style="margin:14px 0 18px" autocomplete="off">
    <div id="sres"></div>
  </div>`;
  runSearch('');
}
let searchTimer;
async function runSearch(q) {
  if (!$('#sres')) return;
  try {
    const { data: us } = q
      ? await sb.from('profiles').select('*').ilike('name', `%${q}%`).limit(12)
      : await sb.from('profiles').select('*').order('created_at', { ascending: false }).limit(12);
    const users = (us || []).map(mapUser);
    const posts = q ? await postsWith(sb.from('posts').select(POST_COLS).ilike('text', `%${q}%`).order('id', { ascending: false }).limit(12)) : [];
    const el = $('#sres');
    if (!el) return;
    el.innerHTML = `
      ${users.length ? `<h2 class="section">Люди</h2>${users.map((u) => `
        <div class="urow"><div class="ph-head" style="flex:1;min-width:0">${av(u, 'av sm')}<div class="who"><span class="nm" data-user="${esc(u.name)}">${esc(u.name)}${verify(u)}${badges(u)}</span><span class="tm">${esc(u.bio)}</span></div></div></div>`).join('')}` : ''}
      ${posts.length ? `<h2 class="section">Посты</h2>${posts.map(postCard).join('')}` : ''}
      ${!users.length && !posts.length && q ? '<p class="sub center">Ничего не найдено</p>' : ''}`;
    watchViews(el);
  } catch (e) {
    const el = $('#sres');
    if (el) el.innerHTML = `<p class="sub">${esc(e.message)}</p>`;
  }
}

// ---------- Админ-панель: галочка и значки ----------
async function renderAdmin() {
  if (!me || !me.admin) return go({ name: 'profile' });
  const { data } = await sb.from('profiles').select('id,name,bio,verified,badges,avatar_url').order('created_at', { ascending: false }).limit(100);
  adminList = (data || []).map(mapUser);
  $('#main').innerHTML = `<div class="col">
    <button class="pill" data-go="profile" style="margin-bottom:14px">← В профиль</button>
    <h2>Админ-панель</h2>
    <p class="sub" style="margin:6px 0 16px">Выдавайте галочку и значки. Изменения сохраняются сразу.</p>
    <div id="alist">${adminList.map(adminRow).join('')}</div>
  </div>`;
}
function adminRow(u) {
  return `<div class="urow" data-admin="${esc(u.name)}">
    <div class="ph-head" style="min-width:140px">${av(u, 'av sm')}<div class="who"><span class="nm">${esc(u.name)}${verify(u)}</span></div></div>
    <button class="switch ${u.verified ? 'on' : ''}" data-verify="${esc(u.name)}">${u.verified ? 'Галочка: да' : 'Галочка: нет'}</button>
    <div class="chips">${Object.keys(BADGE).map((k) => `<button class="chip ${u.badges.includes(k) ? 'on' : ''}" data-badge="${k}" data-for="${esc(u.name)}" title="${BADGE_LABEL[k]}">${BADGE[k]}</button>`).join('')}</div>
  </div>`;
}
async function saveAdmin(name) {
  const u = adminList.find((x) => x.name === name);
  const { error } = await sb.rpc('admin_set_profile', { target: name, is_verified: u.verified, new_badges: u.badges });
  if (error) throw new Error(error.message);
  const row = $(`[data-admin="${CSS.escape(name)}"]`);
  if (row) row.outerHTML = adminRow(u);
}

// ---------- Действия ----------
document.addEventListener('click', async (e) => {
  const t = (sel) => e.target.closest(sel);
  try {
    if (t('#authGo')) {
      const err = $('#gateErr');
      if (err) err.textContent = 'Отправляю…';
      try {
        await authSubmit();
      } catch (er) {
        if (err) err.textContent = er.message;
        toast(er.message);
      }
      return;
    }
    if (t('#authSwitch')) return renderGate(gateMode === 'reg' ? 'login' : 'reg');
    if (t('[data-go]')) return go({ name: t('[data-go]').dataset.go, tab: 'all', user: null });
    if (t('#newBtn') || t('#tabNew')) { go({ name: 'feed', tab: 'all' }); setTimeout(() => $('#ptext')?.focus(), 200); return; }
    if (t('[data-tab]')) { route.tab = t('[data-tab]').dataset.tab; return renderFeed(); }
    if (t('[data-more]')) return loadFeed();
    if (t('[data-rmimg]')) { pendingImg = ''; $('#pthumb').innerHTML = ''; return; }
    if (t('[data-del]')) {
      e.stopPropagation();
      if (!confirm('Удалить пост?')) return;
      const { error } = await sb.from('posts').delete().eq('id', Number(t('[data-del]').dataset.del));
      if (error) throw new Error(error.message);
      return render();
    }
    if (t('[data-like]')) {
      e.stopPropagation();
      if (!me) return toast('Войдите, чтобы ставить лайки');
      const btn = t('[data-like]');
      const id = Number(btn.dataset.like);
      const liked = btn.classList.contains('on');
      if (liked) await sb.from('likes').delete().eq('post_id', id).eq('user_id', me.id);
      else await sb.from('likes').insert({ post_id: id, user_id: me.id });
      const { count } = await sb.from('likes').select('*', { count: 'exact', head: true }).eq('post_id', id);
      btn.classList.toggle('on', !liked);
      btn.querySelector('b').textContent = count ?? 0;
      return;
    }
    if (t('[data-comment]')) {
      const text = $('#ctext').value.trim();
      if (!text) return toast('Напишите комментарий');
      const id = Number(t('[data-comment]').dataset.comment);
      const { error } = await sb.from('comments').insert({ post_id: id, user_id: me.id, text });
      if (error) throw new Error(error.message);
      return renderPost(id);
    }
    if (t('[data-user]')) { e.stopPropagation(); return go({ name: 'profile', user: t('[data-user]').dataset.user }); }
    if (t('[data-follow]')) return toggleFollow(t('[data-follow]').dataset.follow);
    if (t('[data-open]')) return go({ name: 'post', id: Number(t('[data-open]').dataset.open) });
    if (t('#editBio')) {
      const bio = prompt('Описание профиля (до 200 символов)', me.bio || '');
      if (bio === null) return;
      const { error } = await sb.from('profiles').update({ bio: bio.slice(0, 200) }).eq('id', me.id);
      if (error) throw new Error(error.message);
      return renderProfile();
    }
    if (t('#logout')) {
      await sb.auth.signOut();
      me = null;
      return go({ name: 'feed', tab: 'all' });
    }
    if (t('[data-verify]')) {
      const u = adminList.find((x) => x.name === t('[data-verify]').dataset.verify);
      u.verified = !u.verified;
      return saveAdmin(u.name);
    }
    if (t('[data-badge]')) {
      const b = t('[data-badge]');
      const u = adminList.find((x) => x.name === b.dataset.for);
      const k = b.dataset.badge;
      u.badges = u.badges.includes(k) ? u.badges.filter((x) => x !== k) : [...u.badges, k].slice(0, 8);
      return saveAdmin(u.name);
    }
  } catch (err) {
    toast(err.message);
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'pfile') onPostFile(e);
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'sq') {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runSearch(e.target.value.trim()), 250);
  }
});

// ---------- Старт ----------
sb.auth.onAuthStateChange(async () => { await loadMe(); });
(async () => {
  try { await loadMe(); } catch (e) { showFatal('Не удалось проверить вход: ' + e.message); }
  go({ name: 'feed', tab: 'all' });
})();
